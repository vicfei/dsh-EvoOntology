name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: engine syntax
        run: python3 -m py_compile scripts/evoontology.py scripts/adapter_autoontology.py
      - name: record store semantics (pure, no network)
        run: |
          python3 - <<'EOF'
          import importlib.util, json, sys
          sys.path.insert(0, "scripts")
          spec = importlib.util.spec_from_file_location("ev", "scripts/evoontology.py")
          M = importlib.util.module_from_spec(spec); spec.loader.exec_module(M)
          E = {"id": "ev1", "type": "Evidence", "recorded_at": "t", "quote": "CREATE TABLE t(x INT)", "source": "schema.sql"}
          T_ok = {"id": "t1", "type": "Term", "recorded_at": "t", "name": "Revenue",
                  "evidence": [{"quote": "revenue column", "source": "ddl"}]}
          T_ref = {"id": "t2", "type": "Term", "recorded_at": "t", "name": "Churn", "evidence_ids": ["ev1"]}
          T_noev = {"id": "t3", "type": "Term", "recorded_at": "t", "name": "Ghost"}
          T_dangling = {"id": "t4", "type": "Term", "recorded_at": "t", "name": "X", "evidence_ids": ["ev404"]}
          M_bad = {"id": "m1", "type": "Mapping", "recorded_at": "t", "evidence": [{"quote": "q", "source": "s"}]}
          R_bad = {"id": "r1", "type": "Relation", "recorded_at": "t", "subject": "a", "predicate": "p",
                   "evidence": [{"quote": "q", "source": "s"}]}
          assert M.validate_records([E, T_ok, T_ref]) == []
          assert any("no evidence" in e for e in M.validate_records([T_noev]))
          assert any("do not reference" in e for e in M.validate_records([T_dangling]))
          assert any("Mapping needs" in e for e in M.validate_records([M_bad]))
          assert any("Relation needs" in e for e in M.validate_records([R_bad]))
          assert any("duplicate id" in e for e in M.validate_records([T_ok, dict(T_ok)]))
          v01 = {"domain": "x", "built_at": "t", "tbox": {"entity_types": [{"name": "tool"}], "relation_types": []},
                 "abox": {"entities": [{"name": "A", "type": "tool", "docs": ["d"], "evidences": [{"quote": "q", "doc": "d"}]}],
                          "relations": [{"subject": "A", "predicate": "p", "object": "B", "docs": ["d"], "evidences": [{"quote": "r", "doc": "d"}]}]},
                 "stats": {"entities": 1, "relations": 1}}
          assert M.validate_v01_artifact(v01) == []
          bad_v01 = json.loads(json.dumps(v01)); bad_v01["abox"]["entities"][0]["evidences"] = []
          assert M.validate_v01_artifact(bad_v01)
          print("record store: PASS")
          EOF
      - name: trajectory store semantics (pure, no network)
        run: |
          python3 - <<'EOF'
          import importlib.util, os, sys, tempfile
          os.environ["EVO_HOME"] = tempfile.mkdtemp()
          sys.path.insert(0, "scripts")
          spec = importlib.util.spec_from_file_location("ev", "scripts/evoontology.py")
          M = importlib.util.module_from_spec(spec); spec.loader.exec_module(M)
          M.WORKSPACE = os.environ["EVO_HOME"]
          r1 = M.trajectory_append({"agent": "dsh-tradingagents", "summary": "NVDA PASS@72",
                                    "provenance": {"model": "deepseek-chat", "calls": 6}})
          r2 = M.trajectory_append({"agent": "dsh-auto-ontology", "summary": "corpus build"})
          assert r1["task_id"] != r2["task_id"] and r1["recorded_at"]
          assert M.trajectory_count() == 2
          for bad in ({"agent": "x"}, {"agent": "x", "summary": "dup", "task_id": r1["task_id"]}):
              try:
                  M.trajectory_append(bad); assert False
              except SystemExit:
                  pass
          assert M.trajectory_count() == 2
          print("trajectory store: PASS")
          EOF
      - name: trigger semantics (pure, no network)
        run: |
          python3 - <<'EOF'
          import importlib.util, os, sys, tempfile, datetime as dt, time
          os.environ["EVO_HOME"] = tempfile.mkdtemp()
          sys.path.insert(0, "scripts")
          spec = importlib.util.spec_from_file_location("ev", "scripts/evoontology.py")
          M = importlib.util.module_from_spec(spec); spec.loader.exec_module(M)
          M.WORKSPACE = os.environ["EVO_HOME"]
          now = dt.datetime(2026, 11, 19)
          d, w = M.trigger_due({}, 0, now=now); assert not d and "empty" in w
          d, w = M.trigger_due({}, 3, now=now); assert d and "first evolution" in w
          M.trajectory_append({"agent": "a", "summary": "seed"})
          M.trigger_mark({})
          for i in range(8):
              M.trajectory_append({"agent": "a", "summary": f"s{i}"}); time.sleep(0.02)
          d, w = M.trigger_due(M.trigger_state(), M.trajectory_count(), now=now)
          assert not d
          M.trajectory_append({"agent": "a", "summary": "s9"}); time.sleep(0.02)
          M.trajectory_append({"agent": "a", "summary": "s10"}); time.sleep(0.02)
          d, w = M.trigger_due(M.trigger_state(), M.trajectory_count(), now=now)
          assert d and "10 new trajectories" in w
          M.trigger_mark({})
          st = {"last_evolution_at": "2026-11-11T00:00:00", "trajectory_count_at_last": 11}
          M.trajectory_append({"agent": "a", "summary": "later"}); time.sleep(0.02)
          d, w = M.trigger_due(st, M.trajectory_count(), now=now, min_days=7)
          assert d and "days elapsed" in w
          st2 = {"last_evolution_at": "2026-11-11T00:00:00", "trajectory_count_at_last": 12}
          d, w = M.trigger_due(st2, 12, now=now, min_days=7); assert not d
          print("trigger: PASS")
          EOF
      - name: evolution session + gate (pure, no network)
        run: |
          python3 - <<'EOF'
          import importlib.util, os, sys, tempfile, time
          os.environ["EVO_HOME"] = tempfile.mkdtemp()
          sys.path.insert(0, "scripts")
          spec = importlib.util.spec_from_file_location("ev", "scripts/evoontology.py")
          M = importlib.util.module_from_spec(spec); spec.loader.exec_module(M)
          M.WORKSPACE = os.environ["EVO_HOME"]
          E = {"id":"ev1","type":"Evidence","recorded_at":"t","quote":"q","source":"s"}
          T = {"id":"t1","type":"Term","recorded_at":"t","name":"Rev","evidence_ids":["ev1"]}
          T_ghost = {"id":"t2","type":"Term","recorded_at":"t","name":"Ghost"}
          good = M.evaluation_score([E, T]); ghost = M.evaluation_score([E, T, T_ghost])
          assert good["total"] > ghost["total"]
          assert M.gate_decides(good, ghost) and not M.gate_decides(good, good)
          M.snapshot_version(0, [E], note="seed")
          assert M.latest_version() == 0
          try: M.snapshot_version(0, [E]); assert False
          except SystemExit: pass
          for i in range(3):
              M.trajectory_append({"agent":"t","summary":f"s{i}"}); time.sleep(0.02)
          run = M.run_start("add Term", budget=2)
          run, rec = M.run_round([E, T])
          assert rec["won"] and run["status"] == "completed" and run["accepted_version"] == 1
          run2 = M.run_start("try ghost", budget=1)
          run2, rec2 = M.run_round([E, T, T_ghost])
          assert not rec2["won"] and run2["status"] == "running"
          try:
              run2, _ = M.run_round([E, T], run=run2); assert False
          except SystemExit: pass
          reloaded = M.run_load(run2["run_id"])
          assert reloaded["status"] == "incomplete" and reloaded["incomplete_reason"] == "budget_exhausted"
          ext = M.run_extend(run2["run_id"], extra=1)
          assert ext["status"] == "running" and ext["budget"]["max_rounds"] == 2
          print("session + gate: PASS")
          EOF
      - name: auto-ontology adapter, without a model (pure, no network)
        run: |
          python3 - <<'EOF'
          import importlib.util, json, os, shutil, sys, tempfile
          os.environ["EVO_HOME"] = tempfile.mkdtemp()
          sys.path.insert(0, "scripts")
          spec = importlib.util.spec_from_file_location("ev", "scripts/evoontology.py")
          M = importlib.util.module_from_spec(spec); spec.loader.exec_module(M)
          M.WORKSPACE = os.environ["EVO_HOME"]
          import adapter_autoontology as A
          def ev(i, kind, **kw):
              d = {"schema": "ao-trajectory/0.1", "id": f"aot_{i:016x}", "seq": i, "kind": kind, "at": None,
                   "agent": "dsh-auto-ontology/m", "summary": f"{kind} {i}", "domain": "d",
                   "artifact": {"built_at": "2026-11-25T17:18:55", "source": "a.json", "model": "m",
                                "judge": "deepseek-chat"}, "endorsed": None}
              d.update(kw); return d
          stream = [
              ev(0, "build", tbox={"entity_types": ["tool", "metric"], "relation_types": [],
                                   "entity_type_descs": {"tool": "a thing", "metric": "a number"},
                                   "relation_type_descs": {}}),
              ev(1, "assertion", subject={"name": "W", "type": "tool"}, evidence={"quote": "W is a tool.", "doc": "d"},
                 verdict="grounded", by="judge", endorsed=True),
              ev(2, "assertion", subject={"name": "X", "type": "tool"}, evidence={"quote": "X is mentioned.", "doc": "d"},
                 verdict="ungrounded", by="judge", reason="mention only", endorsed=False),
              ev(3, "assertion", subject={"name": "Y", "type": "tool"}, evidence={"quote": "Y reports a metric.", "doc": "d"},
                 verdict="ungrounded", by="judge", reason="reports, not is", endorsed=False),
              ev(4, "assertion", subject={"subject": "W", "predicate": "uses", "object": "Y"},
                 evidence={"quote": "W uses Y.", "doc": "d"}, verdict="grounded", by="judge", endorsed=True),
              ev(5, "assertion", subject={"subject": "W", "predicate": "uses", "object": "X"},
                 evidence={"quote": "W uses X.", "doc": "d"}, verdict="grounded", by="judge", endorsed=True),
              ev(6, "certification", at="2026-11-25T18:00:00", subject={"name": "X", "type": "tool"},
                 verdict="reject", by="human:v", note="mention only", evidence={"quote": "X is mentioned.", "doc": "d"})]
          path = os.path.join(os.environ["EVO_HOME"], "s.ndjson")
          open(path, "w").write("\n".join(json.dumps(e) for e in stream) + "\n")
          # import is idempotent by event id: a replay adds nothing, a foreign line stops it
          assert M.trajectory_import(path) == (7, 0)
          assert M.trajectory_import(path) == (0, 7)
          assert M.trajectory_count() == 7
          bad = path + ".bad"
          open(bad, "w").write(json.dumps(stream[0]) + "\n" + '{"schema": "other/1", "id": "x"}\n')
          try:
              M.read_stream(bad); assert False
          except SystemExit: pass
          # the projection: one Term per (entity, type), verdicts kept on their quotes,
          # a reject suppresses its typing and takes the rejected endpoint's relation with it
          proj, builds = M.project_auto_ontology(M.trajectories())
          assert [r["id"] for r in proj] == [r["id"] for r in M.project_auto_ontology(M.trajectories())[0]]
          assert M.validate_records(proj) == []
          terms = {r["name"]: r for r in proj if r["type"] == "Term"}
          assert set(terms) == {"W", "Y"}
          assert terms["W"]["verdict"] == "grounded" and terms["Y"]["verdict"] == "ungrounded"
          assert terms["Y"]["evidence"][0]["reason"] == "reports, not is"
          assert [(r["subject"], r["object"]) for r in proj if r["type"] == "Relation"] == [("W", "Y")]
          rules = [r["rule"] for r in proj if r["type"] == "Constraint"]
          assert len(rules) == 1 and "X is not a tool" in rules[0]
          assert A.tbox_of(builds["d"]) == [{"name": "tool", "desc": "a thing"}, {"name": "metric", "desc": "a number"}]
          assert A.tbox_of({"tbox": {"entity_types": [{"name": "tool", "desc": "a thing"}]}}) == [{"name": "tool", "desc": "a thing"}]
          assert A.tbox_of({"tbox": {"entity_types": ["tool"]}}) == [{"name": "tool", "desc": ""}]   # an export that predates the definitions
          # a name re-typed twice: the certification in force rejects its current typing AND lists
          # the first one (`also_rejects`), so neither typing projects back
          chain = [ev(0, "build", tbox={"entity_types": ["tool", "metric", "gauge"]}),
                   ev(1, "assertion", subject={"name": "V", "type": "tool"}, evidence={"quote": "V is a tool.", "doc": "d"},
                      verdict="grounded", by="judge", endorsed=True),
                   ev(2, "assertion", subject={"name": "V", "type": "metric"}, evidence={"quote": "V is a metric.", "doc": "d"},
                      verdict="grounded", by="judge:deepseek-reasoner", endorsed=True),
                   ev(3, "assertion", subject={"name": "V", "type": "gauge"}, evidence={"quote": "V is a gauge.", "doc": "d"},
                      verdict="grounded", by="judge:deepseek-reasoner", endorsed=True),
                   ev(4, "certification", at="2026-11-25T18:00:00", subject={"name": "V", "type": "tool"}, verdict="reject",
                      by="agent:evoontology-adapter", note="", evidence={"quote": "V is a tool.", "doc": "d"},
                      retyped_to={"type": "metric", "quote": "V is a metric.", "doc": "d", "judge": "deepseek-reasoner"}),
                   ev(5, "certification", at="2026-11-25T18:10:00", subject={"name": "V", "type": "metric"}, verdict="reject",
                      by="agent:evoontology-adapter", note="", evidence={"quote": "V is a metric.", "doc": "d"},
                      retyped_to={"type": "gauge", "quote": "V is a gauge.", "doc": "d", "judge": "deepseek-reasoner"},
                      also_rejects=["tool"])]
          proj2, _ = M.project_auto_ontology(chain)
          assert [(r["type"], r.get("name") or r["rule"]) for r in proj2] == [
              ("Term", "V"), ("Constraint", "V is not a metric, nor a tool — rejected by agent:evoontology-adapter")]
          assert proj2[0]["ontology_type"] == "gauge" and len(proj2[0]["evidence"]) == 1
          no_chain = [dict(e) for e in chain]
          no_chain[5].pop("also_rejects")                                    # an export without the list: the first typing returns
          back = M.project_auto_ontology(no_chain)[0]
          assert sorted(r.get("ontology_type") for r in back if r["type"] == "Term") == ["gauge", "tool"]
          assert back[-1]["rule"] == "V is not a metric — rejected by agent:evoontology-adapter"
          # E1 layers score exactly as before: no verdict carried, no endorsed term
          E = {"id": "ev1", "type": "Evidence", "recorded_at": "t", "quote": "q", "source": "s"}
          T = {"id": "t1", "type": "Term", "recorded_at": "t", "name": "Rev", "evidence_ids": ["ev1"]}
          s = M.evaluation_score([E, T])
          assert s["endorsed"] == 0.0
          assert s["total"] == round(s["coverage"] + s["cleanliness"] + s["diversity"], 4)
          # the gate counts verdicts: a judge-grounded re-typing beats the projection on endorsed alone
          inc = M.evaluation_score(proj)
          assert inc["endorsed"] == 0.25 and inc["total"] == 2.85
          y = terms["Y"]
          new = dict(y, id="ao:term:new", ontology_type="metric", verdict="grounded",
                     evidence=[{"quote": "Y reports a metric.", "source": "d", "verdict": "grounded"}])
          cand = M.evaluation_score([new if r is y else r for r in proj])
          assert cand["endorsed"] == 0.75 and cand["total"] > inc["total"]
          for k in ("coverage", "cleanliness", "diversity"):
              assert cand[k] == inc[k]
          assert M.gate_decides(cand, inc) and not M.gate_decides(inc, inc)
          # a round against the projection as the incumbent, with nothing published yet
          run = M.run_start("re-type", budget=1)
          run, rec = M.run_round([new if r is y else r for r in proj], run, incumbent=proj, note={"n": 1})
          assert rec["won"] and rec["note"] == {"n": 1} and rec["incumbent_score"] == inc
          assert run["status"] == "completed" and run["accepted_version"] == 1
          assert M.load_version(1)["record_count"] == len(proj)
          # without an explicit incumbent nothing published means an empty one (the E1 path, unchanged)
          os.environ["EVO_HOME"] = tempfile.mkdtemp(); M.WORKSPACE = os.environ["EVO_HOME"]
          run2, rec2 = M.run_round([E, T], M.run_start("first", budget=1))
          assert rec2["won"] and rec2["incumbent_score"]["total"] == 0.0
          # the adapter without a model: import + projection only, no run opened
          os.environ["EVO_HOME"] = tempfile.mkdtemp(); M.WORKSPACE = os.environ["EVO_HOME"]
          A.run(path, dry_run=True, K=M)
          assert M.trajectory_count() == 7 and not os.path.isdir(os.path.join(M.WORKSPACE, "runs"))
          # the proposer is verified before any judge sees it: type in the TBox, not the current
          # typing, quote one of the term's own — else the proposal is dropped as malformed, with its reason
          class Fake:
              def __init__(self, out): self.out = out
              def complete(self, model, messages):
                  assert "metric: a number" in messages[1]["content"] and "Y reports a metric." in messages[1]["content"]
                  return self.out, {"prompt_tokens": 10, "completion_tokens": 5}
              def is_verbatim(self, q, t):        # the sibling's rule, in miniature: whitespace collapsed
                  return " ".join(q.split()) in " ".join(t.split())
          types, led = A.tbox_of(builds["d"]), {"calls": 0, "in": 0, "out": 0}
          ok = {"type": "metric", "quote": "Y reports a metric.", "why": "states it"}
          st, p_ok = A._propose(y, types, Fake(ok), "m", led)
          assert st == "ok" and p_ok["to_type"] == "metric" and p_ok["doc"] == "d" and p_ok["term_id"] == y["id"]
          assert "snapped" not in p_ok
          for out, why in (({"type": "plugin", "quote": "Y reports a metric."}, "a type outside the TBox"),   # not a listed type
                           ({"type": "metric", "quote": "Y is a metric, invented."}, "not one of the term's quotes"),
                           ({"type": "tool", "quote": "Y is a tool."}, "the term's current type"),           # the current typing again
                           ({"type": "metric", "quote": "Y reports a"}, "part of own quote [1], not the quote"),
                           ({"type": "metric", "quote": "Y reports a metric. Plus this."}, "own quote [1] with more added"),
                           ({"type": "metric", "quote": None}, "not one of the term's quotes")):
              st, bad_p = A._propose(y, types, Fake(out), "m", led)
              assert st == "malformed" and bad_p["why"] == why and bad_p["from_type"] == "tool", (st, bad_p)
          A._show("malformed:", [bad_p])   # a malformed record prints its reason; nothing else is asked of it
          # the same quote as the sibling's verbatim rule sees it: snapped to the term's OWN string
          st, p_snap = A._propose(y, types, Fake({"type": "metric", "quote": "Y   reports a metric. "}), "m", led)
          assert st == "snapped" and p_snap["snapped"] is True and p_snap["quote"] == "Y reports a metric."
          assert A._propose(y, types, Fake(None), "m", led) == ("none", None)  # an honest null
          class OldSibling(Fake):              # a sibling that predates its verbatim rule: exact match only
              is_verbatim = None
          assert A._propose(y, types, OldSibling({"type": "metric", "quote": "Y  reports a metric."}), "m", led)[1]["why"] == \
              "not one of the term's quotes"
          assert led == {"calls": 10, "in": 100, "out": 50}
          # the judge is the sibling's own eval CLI: a fake checkout proves the wiring end to end
          ao = os.path.join(os.environ["EVO_HOME"], "ao"); os.makedirs(ao)
          open(os.path.join(ao, "eval_evidence.py"), "w").write(
              "import json, sys\n"
              "a = sys.argv\n"
              "art = json.load(open(a[a.index('--from') + 1]))\n"
              "assert a[a.index('--judge-model') + 1] == 'fake-judge' and a[a.index('--n') + 1] == '0'\n"
              "assert art['abox']['entities'][0]['evidences'] == [{'quote': 'Y reports a metric.', 'doc': 'd'}]\n"
              "with open(a[a.index('--out') + 1], 'w') as f:\n"
              "    for e in art['abox']['entities']:\n"
              "        q = chr(39)\n"
              "        row = {'assertion': e['name'] + ' is of type ' + q + e['type'] + q,\n"
              "               'supported': e['type'] == 'metric', 'reason': 'fake judge'}\n"
              "        f.write(json.dumps(row) + '\\n')\n")
          p_bad = dict(p_ok, name="Z", to_type="tool", quote="Z is a tool.")
          judged = A.judge_proposals([p_ok, p_bad], types, ao, "fake-judge", 2, os.environ["EVO_HOME"])
          assert [x["judged"] for x in judged] == [True, False] and judged[0]["judge_reason"] == "fake judge"
          retyped = A.retype(y, judged[0], "fake-judge", K=M)
          assert retyped["verdict"] == "grounded" and retyped["ontology_type"] == "metric"
          assert retyped["evidence"][0] == {"quote": "Y reports a metric.", "source": "d", "verdict": "grounded",
                                             "by": "judge:fake-judge", "reason": "fake judge"}
          # the whole run offline: a fake sibling whose proposer answers (with stray whitespace) and whose
          # eval judges — the run completes, the layer publishes, all of it is on disk
          open(os.path.join(ao, "grounding.py"), "w").write(
              "def complete(model, messages):\n"
              "    return {'type': 'metric', 'quote': 'Y  reports a metric.', 'why': 'states it'}, "
              "{'prompt_tokens': 10, 'completion_tokens': 5}\n"
              "def is_verbatim(q, t):\n"
              "    return ' '.join(q.split()) in ' '.join(t.split())\n")
          A.run(path, auto_ontology=ao, proposer_model="m", judge_model="fake-judge", jobs=2, K=M)
          rid = [f.split(".")[0] for f in os.listdir(M.runs_dir()) if f.endswith(".json") and ".proposals." not in f]
          assert len(rid) == 1
          run = M.run_load(rid[0])
          assert run["status"] == "completed" and run["accepted_version"] == 1
          assert run["budget"] == {"max_rounds": 1, "rounds_used": 1}
          assert run["rounds"][0]["note"]["proposals"] == {"ok": 0, "snapped": 1, "none": 0, "malformed": 0}
          assert run["rounds"][0]["candidate_score"]["endorsed"] > run["rounds"][0]["incumbent_score"]["endorsed"]
          back = json.load(open(os.path.join(M.runs_dir(), rid[0] + ".proposals.json")))
          assert back["judge_model"] == "fake-judge" and back["proposer_model"] == "m" and len(back["proposals"]) == 1
          assert back["proposals"][0]["grounded"] is True and back["proposals"][0]["snapped"] is True
          assert back["proposals"][0]["quote"] == "Y reports a metric."        # the term's own string, not the model's copy
          assert back["apply_actor"] == "agent:evoontology-adapter"
          on_disk = json.load(open(os.path.join(M.runs_dir(), rid[0] + ".judge", "round-1", "proposed.json")))
          assert on_disk["terms"] == 1 and on_disk["tally"]["snapped"] == 1 and on_disk["malformed"] == []
          assert not os.path.exists(os.path.join(M.runs_dir(), rid[0] + ".judge", "proposed.json"))
          assert [r["ontology_type"] for r in M.load_version(1)["records"] if r["type"] == "Term" and r["name"] == "Y"] == ["metric"]
          # the candidate is scored with the constraint its certification adds: 3 of 5 records endorsed, not 3 of 4
          assert run["rounds"][0]["candidate_score"]["endorsed"] == 0.6 and run["rounds"][0]["candidate_score"]["count"] == 5
          # what the round published is what the trip back projects: the two events `apply --proposals`
          # and a re-export add (the old typing rejected, the new asserted with its judge named)
          trip = [ev(70, "assertion", subject={"name": "Y", "type": "metric"},
                     evidence={"quote": "Y reports a metric.", "doc": "d"}, verdict="grounded",
                     by="judge:fake-judge", reason="fake judge", endorsed=True),
                  ev(71, "certification", at="2026-11-25T19:00:00", subject={"name": "Y", "type": "tool"}, verdict="reject",
                     by="agent:evoontology-adapter", note="re-typed as metric: judge fake-judge grounded another quote",
                     evidence={"quote": "Y reports a metric.", "doc": "d", "grounded": False, "reason": "reports, not is"},
                     retyped_to={"type": "metric", "quote": "Y reports a metric.", "doc": "d", "judge": "fake-judge"})]
          back_stream = path + ".back"
          open(back_stream, "w").write(open(path).read() + "\n".join(json.dumps(e) for e in trip) + "\n")
          A.run(back_stream, dry_run=True, K=M)
          after, _ = M.project_auto_ontology(M.trajectories())
          published = M.load_version(1)["records"]
          same = lambda r: (r["id"], r["type"], r.get("verdict"), r.get("ontology_type"), r.get("rule"), r.get("domain"),
                            json.dumps(r.get("evidence"), sort_keys=True), r.get("subject"), r.get("predicate"), r.get("object"))
          assert sorted(map(same, after)) == sorted(map(same, published))       # the apply time is the one thing left out
          assert M.evaluation_score(after) == run["rounds"][0]["candidate_score"]
          assert [r["id"] for r in after if r["type"] == "Constraint" and r["rule"].startswith("Y is not")] == [
              f"ao:reject:{M._h('d', M._nk('Y'), 'tool')}"]
          # the quotes reach the model as JSON lines: the value it copies is bounded by the encoding,
          # never by a source label sitting in front of it
          class Spy(Fake):
              seen = None
              def complete(self, model, messages):
                  Spy.seen = messages[1]["content"]; return self.out, {"prompt_tokens": 1, "completion_tokens": 1}
          A._propose(y, types, Spy(ok), "m", {"calls": 0, "in": 0, "out": 0})
          lines = [l for l in Spy.seen.splitlines() if l.startswith("[")]
          assert [json.loads(l.split(" ", 1)[1]) for l in lines] == [
              {"source": "d", "quote": "Y reports a metric."}] and "(d) Y reports" not in Spy.seen
          # one stream, one run: an unchanged stream never opens a second run on its own — the run
          # that won is completed, the run that lost needs an explicit, recorded extension
          for call, want in ((lambda: A.run(path, auto_ontology=ao, proposer_model="m", judge_model="fake-judge", K=M),
                              "already ran on (completed"),):
              try:
                  call(); assert False
              except SystemExit as why:
                  assert want in str(why) and f"evolve extend {rid[0]}" in str(why), why
          os.environ["EVO_HOME"] = tempfile.mkdtemp(); M.WORKSPACE = os.environ["EVO_HOME"]
          ao3 = os.path.join(os.environ["EVO_HOME"], "ao3"); os.makedirs(ao3)
          open(os.path.join(ao3, "eval_evidence.py"), "w").write(
              "import json, sys\n"
              "a = sys.argv\n"
              "art = json.load(open(a[a.index('--from') + 1]))\n"
              "with open(a[a.index('--out') + 1], 'w') as f:\n"
              "    for e in art['abox']['entities']:\n"
              "        q = chr(39)\n"
              "        f.write(json.dumps({'assertion': e['name'] + ' is of type ' + q + e['type'] + q,\n"
              "                            'supported': False, 'reason': 'refused'}) + '\\n')\n")
          shutil.copy(os.path.join(ao, "grounding.py"), ao3)
          files = lambda: sorted(f for f in os.listdir(M.runs_dir()) if f.endswith(".json"))
          A.run(path, auto_ontology=ao3, proposer_model="m", judge_model="fake-judge", K=M)   # the judge refuses: lost
          lost_id = files()[0][:-5]
          assert len(files()) == 1 and not os.path.exists(os.path.join(M.runs_dir(), lost_id + ".proposals.json"))
          try:
              A.run(path, auto_ontology=ao3, proposer_model="m", judge_model="fake-judge", K=M); assert False
          except SystemExit as why:
              assert "already ran on (running, 1/1" in str(why) and f"evolve extend {lost_id}" in str(why), why
          M.run_extend(lost_id, extra=1, note="the proposer's prompt was fixed")
          A.run(path, auto_ontology=ao3, proposer_model="m", judge_model="fake-judge", K=M)   # round 2 of the same run
          again = json.load(open(os.path.join(M.runs_dir(), lost_id + ".json")))
          assert len(again["rounds"]) == 2 and again["budget"] == {"max_rounds": 2, "rounds_used": 2}
          assert len(again["extensions"]) == 1 and again["extensions"][0]["extra"] == 1
          assert again["extensions"][0]["note"] == "the proposer's prompt was fixed" and again["stream"]["events"] == 7
          assert files() == [lost_id + ".json"]
          # every round keeps its own judge input and rows: a lost round's survive the round after it
          kept = [[json.loads(l) for l in open(os.path.join(M.runs_dir(), lost_id + ".judge", f"round-{n}", "rows.jsonl")) if l.strip()]
                  for n in (1, 2)]
          assert all(len(rows) == 1 and rows[0]["reason"] == "refused" for rows in kept)
          # a changed stream is a new question: one new event opens a new run
          open(path, "a").write(json.dumps(ev(7, "assertion", subject={"name": "Q", "type": "tool"},
                                             evidence={"quote": "Q is a tool.", "doc": "d"}, verdict="grounded",
                                             by="judge", endorsed=True)) + "\n")
          A.run(path, auto_ontology=ao3, proposer_model="m", judge_model="fake-judge", K=M)
          assert len(files()) == 2
          # a proposer that crashes closes the run as aborted — never left `running` — and aborted is terminal
          os.environ["EVO_HOME"] = tempfile.mkdtemp(); M.WORKSPACE = os.environ["EVO_HOME"]
          M.trajectory_import(path)
          ao2 = os.path.join(os.environ["EVO_HOME"], "ao2"); os.makedirs(ao2)
          shutil.copy(os.path.join(ao, "eval_evidence.py"), ao2)
          open(os.path.join(ao2, "grounding.py"), "w").write("def complete(model, messages):\n    raise RuntimeError('boom')\n")
          sys.modules.pop("grounding", None)
          try:
              A.run(path, auto_ontology=ao2, K=M); assert False
          except RuntimeError:
              pass
          dead = json.load(open(os.path.join(M.runs_dir(), [f for f in os.listdir(M.runs_dir()) if f.endswith(".json")][0])))
          assert dead["status"] == "aborted" and dead["incomplete_reason"] == "RuntimeError: boom" and dead["rounds"] == []
          for call in (M.run_load, lambda: M.run_round([], dead, incumbent=[])):
              try:
                  call(); assert False
              except SystemExit:
                  pass
          assert M.run_extend(dead["run_id"])["status"] == "aborted"
          try:
              A.run(path, auto_ontology=ao2, K=M); assert False      # an aborted run holds nothing back…
          except RuntimeError:
              pass
          assert len([f for f in os.listdir(M.runs_dir()) if f.endswith(".json") and ".proposals." not in f]) == 2  # …a new one opens
          # two runs opened in one second never share a file
          r1, r2 = M.run_start("first", 1), M.run_start("second", 1)
          assert r1["run_id"] != r2["run_id"] and M.run_load(r1["run_id"])["hypothesis"] == "first"
          print("auto-ontology adapter: PASS")
          EOF
      - name: bin entry syntax (node --check)
        run: node --check npm/bin/evoontology.js
      - name: npm bundle packs the kernel and the adapter (dry run, no tarball written or deleted)
        run: |
          cd npm
          npm pack --dry-run > /tmp/pack.txt 2>&1
          for f in scripts/evoontology.py scripts/adapter_autoontology.py bin/evoontology.js; do
            grep -q "$f" /tmp/pack.txt || { echo "MISSING FROM THE BUNDLE: $f"; cat /tmp/pack.txt; exit 1; }
          done
          if ls *.tgz >/dev/null 2>&1; then
            echo "a tarball is sitting in npm/ — not deleted by CI; remove it by hand"; exit 1
          fi
      - name: sqlite seed (pure, no network)
        run: |
          python3 - <<'EOF'
          import importlib.util, os, sqlite3, sys, tempfile
          os.environ["EVO_HOME"] = tempfile.mkdtemp()
          sys.path.insert(0, "scripts")
          spec = importlib.util.spec_from_file_location("ev", "scripts/evoontology.py")
          M = importlib.util.module_from_spec(spec); spec.loader.exec_module(M)
          M.WORKSPACE = os.environ["EVO_HOME"]
          db = os.path.join(os.environ["EVO_HOME"], "test.db")
          conn = sqlite3.connect(db)
          conn.execute("CREATE TABLE users (id INTEGER PRIMARY KEY, name TEXT NOT NULL, email TEXT UNIQUE)")
          conn.execute("CREATE TABLE orders (id INTEGER PRIMARY KEY, user_id INTEGER REFERENCES users(id), total REAL)")
          conn.commit(); conn.close()
          recs = M.sqlite_seed(db)
          assert len(recs) == 18  # 6 cols x 3 (Evidence+Term+Mapping)
          terms = [r for r in recs if r["type"] == "Term"]
          assert len(terms) == 6 and any(t["name"] == "users.name" for t in terms)
          assert all(t["evidence_ids"] for t in terms)
          assert M.validate_records(recs) == []
          recs2 = M.sqlite_seed(db)
          assert [r["id"] for r in recs] == [r["id"] for r in recs2]
          print("sqlite seed: PASS")
          EOF
      - name: CLI end-to-end on a clean workspace
        run: |
          mkdir -p /tmp/ws && cd /tmp/ws
          echo '{"type":"Evidence","id":"ev1","quote":"CREATE TABLE rev(x INT)","source":"schema.sql"}' > /dev/null
          python3 "$GITHUB_WORKSPACE/scripts/evoontology.py" record add --json '{"type":"Evidence","id":"ev1","recorded_at":"2026-11-19T00:00:00","quote":"CREATE TABLE rev(x INT)","source":"schema.sql"}'
          python3 "$GITHUB_WORKSPACE/scripts/evoontology.py" record add --json '{"type":"Term","id":"t1","recorded_at":"2026-11-19T00:00:01","name":"Revenue","evidence_ids":["ev1"]}'
          if python3 "$GITHUB_WORKSPACE/scripts/evoontology.py" record add --json '{"type":"Term","id":"t2","recorded_at":"2026-11-19T00:00:02","name":"Ghost"}'; then
            echo "GHOST RECORD ACCEPTED — constitution violated"; exit 1
          fi
          python3 "$GITHUB_WORKSPACE/scripts/evoontology.py" validate .evo/records.jsonl
